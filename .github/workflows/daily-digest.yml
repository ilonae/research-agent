name: Daily ArXiv Paper Digest

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC every morning
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write           # needed to push the committed digest

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait until the API is accepting connections
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags && break
            sleep 2
          done

      - name: Pull Ollama model
        run: ollama pull llama3.2:3b

      - name: Run agent
        env:
          AGENT_OLLAMA_URL: http://localhost:11434
        run: python main.py

      - name: Commit digest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/digests/
          git diff --staged --quiet \
            || git commit -m "digest: $(date -u +%Y-%m-%d) [skip ci]"
          git push
