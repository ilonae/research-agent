[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-xai-digest"
version = "0.1.0"
description = "A configurable daily ArXiv digest agent — filter and summarise papers in any research area"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ilona Eisenbraun" }]
requires-python = ">=3.11"
keywords = ["arxiv", "research", "digest", "llm", "agent", "langgraph", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "feedparser>=6.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26",
]

[project.scripts]
arxiv-digest = "agent.cli:main"

[project.urls]
Repository = "https://github.com/ilonae/research-agent"
"Bug Tracker" = "https://github.com/ilonae/research-agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "config*", "tools*", "prompts*"]

[tool.setuptools.package-data]
prompts = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle, pyflakes, isort

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
